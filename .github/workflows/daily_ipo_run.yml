name: Daily IPO Analysis Pipeline

# 1. WHEN SHOULD THIS RUN?
on:
  # Allows you to click a "Run Workflow" button manually whenever you want
  workflow_dispatch: 
  
  schedule:
    # This is a Cron expression. GitHub runs on UTC time.
    # 2:30 AM UTC = 8:00 AM IST (Indian Standard Time)
    # The format is: minute hour day month day-of-week
    - cron: '30 2 * * *'

# 2. WHAT SHOULD IT DO?
jobs:
  run-analysis:
    runs-on: ubuntu-latest # A free Linux machine provided by GitHub

    steps:
      # Step A: Download your code from the repository onto the machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Python on the machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step C: Install necessary libraries (like pandas, requests, psycopg2)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step D: Run the orchestrator script we built!
      - name: Run IPO Analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_ipo_analysis.py
