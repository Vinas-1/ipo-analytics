name: Daily IPO Analysis Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO Analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python run_ipo_analysis.py
